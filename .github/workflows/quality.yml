name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Node 24 quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --fund=false

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # O Pages publica main:/docs como está. Se src/ mudou sem regerar docs/,
      # o site fica com o build antigo e o deploy continua "verde".
      - name: Published build matches source
        run: |
          if [ -n "$(git status --porcelain -- docs)" ]; then
            echo "::error::docs/ está desatualizado: rode npm run build e commite docs/ junto com a mudança em src/."
            git status --short -- docs
            exit 1
          fi
